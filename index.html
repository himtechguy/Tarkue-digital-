<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Wachø Digital — Professional web design and digital solutions by Tarkue_wacho.">
<title>Wachø Digital | Web Design & Digital Solutions</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #05070b;
  --card: #0b1018;
  --blue: #168cff;
  --blue2: #55b6ff;
  --text: #f5f7fa;
  --muted: #929aaa;
  --border: rgba(255,255,255,.08);
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ================= WELCOME SCREEN ================= */

#welcome {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background:
    radial-gradient(circle at 50% 35%, rgba(22,140,255,.15), transparent 35%),
    #030508;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  transition: opacity .8s ease, visibility .8s ease;
}

#welcome.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.welcome-content {
  width: 100%;
  max-width: 600px;
  animation: welcomeUp 1s ease;
}

.logo-mark {
  width: 72px;
  height: 72px;
  margin: 0 auto 28px;
  border: 1px solid rgba(85,182,255,.5);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--blue2);
  font-size: 28px;
  font-weight: 800;
  box-shadow: 0 0 45px rgba(22,140,255,.18);
}

.welcome-brand {
  font-size: clamp(2rem, 9vw, 4rem);
  font-weight: 800;
  letter-spacing: 5px;
}

.welcome-line {
  width: 55px;
  height: 2px;
  background: var(--blue);
  margin: 22px auto;
}

.welcome-content h2 {
  font-size: clamp(1.4rem, 5vw, 2.2rem);
  margin-bottom: 14px;
}

.welcome-content p {
  color: var(--muted);
  line-height: 1.7;
  max-width: 470px;
  margin: auto;
}

.creator {
  margin-top: 28px;
  color: #b9c0cd;
  font-size: .9rem;
}

.creator strong {
  display: block;
  color: white;
  font-size: 1.05rem;
  margin-top: 6px;
}

.enter-btn {
  display: inline-flex;
  margin-top: 34px;
  padding: 15px 25px;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-weight: 700;
  transition: .3s;
  box-shadow: 0 10px 35px rgba(22,140,255,.2);
}

.enter-btn:hover {
  transform: translateY(-3px);
  background: #329cff;
}

/* ================= HEADER ================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: rgba(5,7,11,.75);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.nav {
  max-width: 1150px;
  margin: auto;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 2px;
}

.brand span {
  color: var(--blue2);
}

nav {
  display: flex;
  gap: 24px;
}

nav a {
  color: #c4cad4;
  font-size: .9rem;
  transition: .25s;
}

nav a:hover {
  color: white;
}

.menu {
  display: none;
  font-size: 25px;
  cursor: pointer;
}

/* ================= GENERAL ================= */

section {
  padding: 100px 22px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

.section-label {
  color: var(--blue2);
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 12px;
  font-weight: 700;
}

.section-title {
  font-size: clamp(2rem, 6vw, 3.2rem);
  margin-bottom: 15px;
}

.section-text {
  color: var(--muted);
  line-height: 1.7;
  max-width: 650px;
}

/* ================= HERO ================= */

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding-top: 140px;
  background:
    radial-gradient(circle at 80% 35%, rgba(22,140,255,.13), transparent 28%),
    radial-gradient(circle at 10% 80%, rgba(22,140,255,.07), transparent 25%);
}

.hero-content {
  max-width: 850px;
}

.hero h1 {
  font-size: clamp(3rem, 12vw, 6.5rem);
  line-height: .95;
  letter-spacing: -4px;
  margin-bottom: 25px;
}

.hero h1 span {
  color: var(--blue2);
}

.hero p {
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.8;
  max-width: 650px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 32px;
}

.btn {
  padding: 14px 21px;
  border-radius: 9px;
  font-weight: 700;
  transition: .3s;
}

.btn-primary {
  background: var(--blue);
}

.btn-secondary {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.03);
}

.btn:hover {
  transform: translateY(-3px);
}

/* ================= SERVICES ================= */

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 45px;
}

.card {
  background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  transition: .35s;
}

.card:hover {
  transform: translateY(-6px);
  border-color: rgba(85,182,255,.35);
}

.icon {
  font-size: 25px;
  margin-bottom: 22px;
}

.card h3 {
  margin-bottom: 11px;
}

.card p {
  color: var(--muted);
  line-height: 1.65;
  font-size: .92rem;
}

/* ================= PORTFOLIO ================= */

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-top: 45px;
}

.project {
  min-height: 230px;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px;
  background:
    linear-gradient(135deg, rgba(22,140,255,.12), rgba(255,255,255,.02));
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  transition: .35s;
}

.project:hover {
  transform: translateY(-5px);
  border-color: rgba(85,182,255,.4);
}

.project small {
  color: var(--blue2);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.project h3 {
  font-size: 1.5rem;
  margin-bottom: 9px;
}

.project p {
  color: var(--muted);
  line-height: 1.5;
}

/* ================= PROCESS ================= */

.process {
  margin-top: 45px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 15px;
}

.step {
  padding: 25px;
  border-left: 1px solid var(--blue);
  background: rgba(255,255,255,.025);
}

.step-number {
  color: var(--blue2);
  font-weight: 800;
  margin-bottom: 14px;
}

.step p {
  color: var(--muted);
  line-height: 1.6;
  margin-top: 8px;
  font-size: .9rem;
}

/* ================= ABOUT ================= */

.about-box {
  margin-top: 40px;
  padding: 40px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(120deg, rgba(22,140,255,.08), rgba(255,255,255,.02));
}

.about-box p {
  color: var(--muted);
  line-height: 1.9;
}

/* ================= FAQ ================= */

.faq {
  margin-top: 40px;
  display: grid;
  gap: 12px;
}

details {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 19px;
  background: rgba(255,255,255,.025);
}

summary {
  cursor: pointer;
  font-weight: 700;
}
